# A4: AI-assisted instructor scaffolding. Practice feedback, not final grading.
name: HW4 practice checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  practice:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build
        run: make
      - name: Practice cases
        run: make test
      - name: Memory checks
        run: make sanitize
